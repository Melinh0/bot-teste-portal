[project]
name = "bot-teste-portal"
version = "0.1.0"
description = "Bot de teste automatizado para portal web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bot-teste = "bots.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bots"]
